name: 'Build Image'
description: 'Build a docker image with a shared BuildKit when the runner has one, or the GitHub Actions cache otherwise'
branding:
  icon: 'package'
  color: 'blue'
author: 'Kiba Labs'
inputs:
  image:
    description: 'Name of the image these layers belong to, e.g. api. Used as the GitHub Actions cache scope and as the image name in the BuildKit registry. Use the same image for builds of the same Dockerfile and build args, and a different one when either changes.'
    required: true
  context:
    description: 'Build context'
    required: true
  file:
    description: 'Path to the Dockerfile. Defaults to Dockerfile in the context.'
    required: false
    default: ''
  target:
    description: 'Build target'
    required: false
    default: ''
  build-args:
    description: 'Build args, one per line'
    required: false
    default: ''
  tag:
    description: 'Make the built image available to the local docker daemon under this tag'
    required: false
    default: ''
  push:
    description: 'Tags to push the built image to, one per line. Log in to the registry first.'
    required: false
    default: ''
  cache-mode:
    description: 'GitHub Actions cache mode when building without a shared BuildKit: max caches every stage, min only the layers of the final image (smaller, but intermediate stages rebuild)'
    required: false
    default: 'max'
  driver-opts:
    description: 'Options for the docker-container builder used without a shared BuildKit, one per line, e.g. network=host to reach registries on the runner''s localhost. The builder is created by the first build in the job, so set it there.'
    required: false
    default: ''
  summary:
    description: 'Add the build summary to the job summary and upload the build record as an artifact'
    required: false
    default: 'false'
outputs:
  digest:
    description: 'Digest of the built image, when it is tagged or pushed'
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Choose how to build
      id: resolve
      if: env.CHECKS_ALREADY_PASSED != 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        PUSH: ${{ inputs.push }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        if [[ -n "$TAG" && -n "$PUSH" ]]; then
          echo "::error::Set tag or push, not both"
          exit 1
        fi
        endpoint="${BUILDKIT_ENDPOINT:-}"
        if [[ -z "$endpoint" && "$RUNNER_ENVIRONMENT" == 'self-hosted' && -z "${BUILD_IMAGE_BUILDER:-}" ]]; then
          echo "::notice title=Building without a shared BuildKit::BUILDKIT_ENDPOINT is not set on this self-hosted runner, so images build with the GitHub Actions cache. Set it in the runner's environment to build on a shared BuildKit."
        fi
        outputs=''
        if [[ -z "$TAG" && -z "$PUSH" ]]; then
          outputs='type=cacheonly'
        elif [[ -n "$TAG" && -n "$endpoint" ]]; then
          if [[ -z "${BUILDKIT_REGISTRY:-}" ]]; then
            echo "::error::BUILDKIT_REGISTRY must be set with BUILDKIT_ENDPOINT to tag images"
            exit 1
          fi
          registryImage="$(echo "$BUILDKIT_REGISTRY/$GITHUB_REPOSITORY/$IMAGE" | tr '[:upper:]' '[:lower:]')"
          outputs="type=image,name=$registryImage:latest,push=true,compression=uncompressed,force-compression=true"
          echo "registry-image=$registryImage" >> "$GITHUB_OUTPUT"
        fi
        echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
        echo "outputs=$outputs" >> "$GITHUB_OUTPUT"
    # NOTE(krishan711): builder options only apply to the docker-container builder, the shared BuildKit is configured where it runs
    - name: Set up Docker Buildx
      id: buildx
      if: env.CHECKS_ALREADY_PASSED != 'true' && env.BUILD_IMAGE_BUILDER == ''
      uses: docker/setup-buildx-action@v4
      with:
        driver: ${{ steps.resolve.outputs.endpoint != '' && 'remote' || 'docker-container' }}
        driver-opts: ${{ steps.resolve.outputs.endpoint == '' && inputs.driver-opts || '' }}
        endpoint: ${{ steps.resolve.outputs.endpoint }}
    # NOTE(krishan711): later builds in the job reuse this builder so they share its local state instead of starting a new one
    - name: Remember the builder
      if: env.CHECKS_ALREADY_PASSED != 'true' && env.BUILD_IMAGE_BUILDER == ''
      shell: bash
      env:
        BUILDER: ${{ steps.buildx.outputs.name }}
      run: echo "BUILD_IMAGE_BUILDER=$BUILDER" >> "$GITHUB_ENV"
    - name: Build image
      id: build
      if: env.CHECKS_ALREADY_PASSED != 'true'
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_SUMMARY: ${{ inputs.summary }}
        DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.summary }}
      with:
        builder: ${{ env.BUILD_IMAGE_BUILDER }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        build-args: ${{ inputs.build-args }}
        outputs: ${{ steps.resolve.outputs.outputs }}
        load: ${{ steps.resolve.outputs.endpoint == '' && inputs.tag != '' }}
        push: ${{ inputs.push != '' }}
        tags: ${{ inputs.push != '' && inputs.push || (steps.resolve.outputs.endpoint == '' && inputs.tag || '') }}
        cache-from: ${{ steps.resolve.outputs.endpoint == '' && format('type=gha,scope={0}', inputs.image) || '' }}
        # NOTE(krishan711): a failed cache upload, e.g. when GitHub rate limits the cache, shouldn't fail a build that succeeded
        cache-to: ${{ steps.resolve.outputs.endpoint == '' && format('type=gha,mode={0},scope={1},ignore-error=true', inputs.cache-mode, inputs.image) || '' }}
    - name: Pull image
      if: env.CHECKS_ALREADY_PASSED != 'true' && steps.resolve.outputs.registry-image != ''
      shell: bash
      env:
        IMAGE: ${{ steps.resolve.outputs.registry-image }}@${{ steps.build.outputs.digest }}
        TAG: ${{ inputs.tag }}
      run: |
        docker pull --quiet "$IMAGE"
        docker tag "$IMAGE" "$TAG"
